<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | LabSync</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-page">
    <header>
        <h1>LabSync</h1>
        <p>Account Sign In</p>

        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('register') }}">Register</a>
        </nav>
    </header>

    <main class="auth-main">
        {% if request.args.get("message") %}
            <div class="message">{{ request.args.get("message") }}</div>
        {% endif %}

        <section class="card auth-card">
            <h2>Sign In</h2>
            <p>Enter your LabSync account details.</p>

            <form action="{{ url_for('login') }}" method="post">
                <label for="email">Ashesi email</label>
                <input type="email" id="email" name="email" placeholder="name@ashesi.edu.gh" autocomplete="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>

                <button type="submit">Sign In</button>
            </form>

            <p class="auth-link">
                Need a student account?
                <a href="{{ url_for('register') }}">Register here</a>.
            </p>
        </section>
    </main>
</body>
</html>
