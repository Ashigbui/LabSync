<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | LabSync</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-page">
    <header>
        <h1>LabSync</h1>
        <p>Create a Student Account</p>

        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('login') }}">Sign In</a>
        </nav>
    </header>

    <main class="auth-main">
        {% if request.args.get("message") %}
            <div class="message">{{ request.args.get("message") }}</div>
        {% endif %}

        <section class="card auth-card">
            <h2>Student Registration</h2>
            <p>Registration requires an Ashesi school email ending in <strong>@ashesi.edu.gh</strong>.</p>

            <form action="{{ url_for('register') }}" method="post">
                <label for="full_name">Full name</label>
                <input type="text" id="full_name" name="full_name" autocomplete="name" required>

                <label for="email">Ashesi email</label>
                <input type="email" id="email" name="email" placeholder="name@ashesi.edu.gh" autocomplete="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required>

                <label for="confirm_password">Confirm password</label>
                <input type="password" id="confirm_password" name="confirm_password" minlength="8" autocomplete="new-password" required>

                <button type="submit">Register</button>
            </form>

            <p class="auth-link">
                Already registered?
                <a href="{{ url_for('login') }}">Sign in here</a>.
            </p>
        </section>
    </main>
</body>
</html>
